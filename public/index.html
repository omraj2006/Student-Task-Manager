<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Student Task Manager</h1>
            <p>Manage your academic tasks efficiently</p>
        </header>

        <!-- Add Task Section -->
        <section class="task-form">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <div class="form-group">
                    <label for="taskTitle">Task Title</label>
                    <input type="text" id="taskTitle" placeholder="Enter task title" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="Enter subject" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Enter task description" rows="3"></textarea>
                </div>
                <!-- new added changes -->
                <div class="form-group">
                    <label for="priority">Priority</label>

                    <select id="priority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <button type="submit">
                    Add Task
                </button>

            </form>

        </section>


        <!-- Task List Section -->
        <section class="task-section">

            <div class="task-header">
                <h2>My Tasks</h2>

                <div class="task-count">
                    Total Tasks:
                    <span id="taskCount">0</span>
                </div>
            </div>


            <div id="taskList">

                <!-- Tasks will be added here using JavaScript -->

                <p id="emptyMessage" class="empty-message">
                    No tasks added yet.
                </p>

            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
